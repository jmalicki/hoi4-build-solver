[project]
name = "hoi4-build-solver"
version = "0.1.0"
description = "Build solver for HOI4-style factory planning with CSV I/O"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joseph Malicki" }]
dependencies = [
  "hoi4_build_core",
  "pymdptoolbox>=4.0b3",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "click>=8.1",
]

[project.scripts]
hoi4-build-solve = "py.__main__:main"

[tool.uv]
dev-dependencies = [
    "black>=25.9.0",
]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/hoi4_build_core/Cargo.toml" },
  { file = "src/hoi4_build_core/**/*.rs" }
]

[tool.uv.sources]
hoi4_build_core = { path = "src/hoi4_build_core", editable = true }
