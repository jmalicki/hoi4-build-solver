[project]
name = "hoi4_mdp_core"
version = "0.1.0"
description = "Rust A* core for HOI4 MDP solver (PyO3 extension)"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = { text = "MIT" }

[tool.maturin]
module-name = "hoi4_mdp_core"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
include = [
  "hoi4_mdp_core.pyi",
  "py.typed",
]

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

